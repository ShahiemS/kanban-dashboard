name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            if [ -d /opt/kanban/.git ]; then
              cd /opt/kanban
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf /opt/kanban
              git clone ${{ github.server_url }}/${{ github.repository }}.git /opt/kanban
              cd /opt/kanban
            fi
            docker compose build
            # Reload Caddy config live instead of recreating it, so TLS for
            # other domains served by this proxy (tam.*) keeps working.
            docker compose up -d --no-recreate caddy || docker compose up -d caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            docker compose up -d db backend frontend
