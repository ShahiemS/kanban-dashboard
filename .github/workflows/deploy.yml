name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kanban || mkdir -p /opt/kanban && cd /opt/kanban
            git pull origin main || git clone ${{ github.server_url }}/${{ github.repository }}.git /opt/kanban
            docker compose down
            docker compose up --build -d
