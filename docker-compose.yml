version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kanban}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanban}
      POSTGRES_DB: ${DB_NAME:-kanban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-kanban}
      DB_PASSWORD: ${DB_PASSWORD:-kanban}
      DB_NAME: ${DB_NAME:-kanban}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "npm run migrate && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
