version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kanban}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanban}
      POSTGRES_DB: ${DB_NAME:-kanban}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No public port mapping — backend reaches Postgres over the
    # internal compose network only.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kanban} -d $${POSTGRES_DB:-kanban}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-kanban}
      DB_PASSWORD: ${DB_PASSWORD:-kanban}
      DB_NAME: ${DB_NAME:-kanban}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: "${EMAIL_FROM:-Werkethiek.nl <noreply@werkethiek.nl>}"
      APP_URL: ${APP_URL:-http://localhost}
    # No public port mapping — nginx proxies /api over the
    # internal compose network only.
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm start"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # No public port mapping — Caddy terminates TLS and proxies to it.
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
